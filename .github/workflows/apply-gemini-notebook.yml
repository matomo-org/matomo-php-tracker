name: Apply Google GeminiNotebook update

on:
  push:
    branches:
      - agent/add-google-gemini-notebook

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-google-gemini-notebook

      - name: Update AI bot detection and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tracker = Path('MatomoTracker.php')
          tracker_text = tracker.read_text()
          tracker_old = """        'Perplexity-User',\n        'Google-NotebookLM',\n"""
          tracker_new = """        'Perplexity-User',\n        'Google-GeminiNotebook',\n        'Google-NotebookLM',\n"""
          if tracker_old not in tracker_text:
              raise SystemExit('Expected MatomoTracker.php block not found')
          tracker.write_text(tracker_text.replace(tracker_old, tracker_new, 1))

          tests = Path('tests/Unit/MatomoTrackerTest.php')
          tests_text = tests.read_text()
          tests_old = """            ['Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Perplexity-User/1.0; +https://perplexity.ai/perplexity-user)', true],\n            ['Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36; Devin/1.0; +devin.ai', false],\n"""
          tests_new = """            ['Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Perplexity-User/1.0; +https://perplexity.ai/perplexity-user)', true],\n            ['Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36 (compatible; Google-GeminiNotebook; +https://developers.google.com/crawling/docs/crawlers-fetchers/google-gemininotebook)', true],\n            ['Google-NotebookLM/1.0', true],\n            ['Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36; Devin/1.0; +devin.ai', false],\n"""
          if tests_old not in tests_text:
              raise SystemExit('Expected MatomoTrackerTest.php block not found')
          tests.write_text(tests_text.replace(tests_old, tests_new, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-gemini-notebook.yml

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MatomoTracker.php tests/Unit/MatomoTrackerTest.php .github/workflows/apply-gemini-notebook.yml
          git diff --cached --check
          git commit -m "Detect Google-GeminiNotebook user agent"
          git push origin HEAD:agent/add-google-gemini-notebook
